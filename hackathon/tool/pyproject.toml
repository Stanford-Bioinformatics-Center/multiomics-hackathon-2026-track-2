[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motrpac-probe"
version = "0.1.0"
description = "Probe MoTrPAC exercise contrasts with any disease signature, by omic layer and time"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26", "scipy>=1.13", "matplotlib>=3.8", "jinja2>=3.1", "markupsafe>=2.1",
                "pyarrow>=15"]

[project.optional-dependencies]
test = ["pytest>=8"]
app = ["marimo>=0.16"]

[project.scripts]
mprobe = "motrpac_probe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
motrpac_probe = ["templates/*", "vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
